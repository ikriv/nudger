[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudger"
version = "0.1.0"
description = "Two experiments in agent persistence and clarification"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic-ai-slim[anthropic,openai,retries]==2.45.0",
    "pydantic-evals==2.45.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nudger = "nudger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nudger = ["model_prices.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
